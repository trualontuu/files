<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Files</title>
<style>
:root{--bg:#0a0a0a;--bar:#151515;--frame:#151515;--card:#0b0b0b;--side:#151515;--hover:#161616;--sel:#242424;--sel2:#2d2d2d;--ease:cubic-bezier(.2,.8,.2,1);--fg:#ededed;--dim:#8a8a8a;--mut:#5c5c5c;--line:#222;--field:#0d0d0d;--sw:224px;--pw:320px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--frame);color:var(--fg);font:12.5px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;cursor:default}
body{display:flex;flex-direction:column}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#262626;border:4px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* вкладки */
#top{height:36px;display:flex;align-items:flex-end;flex:none;background:var(--bg)}
#tabs{display:flex;align-items:flex-end;height:36px;padding-left:8px;min-width:0;flex:0 1 auto;overflow:hidden}
.tab{position:relative;flex:0 1 200px;min-width:36px;height:30px;display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;border-radius:9px 9px 0 0;color:var(--dim);transition:background .12s,color .12s}
.tab:hover{background:#121212;color:#c4c4c4}
.tab.on{background:var(--bar);color:var(--fg);z-index:1}
.tab:not(.on):not(:hover)+.tab:not(.on):not(:hover)::before{content:"";position:absolute;left:0;top:9px;height:12px;border-left:1px solid #262626}
.tab.drop{background:#1d1d1d}
.tab .fo{width:16px;height:13px}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.x{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--dim);opacity:0;flex:none}
.tab:hover .x,.tab.on .x{opacity:1}
.x:hover{background:#2b2b2b;color:var(--fg)}
.x svg{width:12px;height:12px;stroke-width:1.7}
#plus{width:28px;height:28px;margin:0 0 2px 4px;border-radius:8px;display:grid;place-items:center;color:var(--dim);flex:none}
#plus:hover{background:#1a1a1a;color:var(--fg)}
#drag{flex:1;height:100%;min-width:40px}
.win{width:46px;height:36px;display:grid;place-items:center;color:#c8c8c8;flex:none}
.win:hover{background:#1c1c1c;color:#fff}
#wclose:hover{background:#e8e8e8;color:#000}
.win svg{width:14px;height:14px;stroke-width:1.2}

/* панель инструментов */
#tool{height:44px;background:var(--bar);display:flex;align-items:center;gap:2px;padding:0 8px;position:relative;flex:none}

#prog{position:absolute;left:0;bottom:0;height:1px;width:0;background:#f2f2f2;z-index:1;opacity:0;transition:opacity .3s}
#prog.on{opacity:1;animation:p 2.4s cubic-bezier(.1,.6,.3,1) forwards}
@keyframes p{from{width:0}to{width:85%}}
.btn{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;color:#d2d2d2;flex:none;position:relative}
.btn:hover{background:#242424;color:#fff}
.btn.off{color:#444;pointer-events:none}
.btn.on{color:#fff;background:#242424}
.sep{width:1px;height:18px;background:#2a2a2a;margin:0 6px;flex:none}
#path{flex:1;min-width:0;height:30px;margin:0 4px 0 6px;background:var(--field);border:1px solid #1d1d1d;border-radius:9px;display:flex;align-items:center;padding:0 4px;position:relative}
#path:hover{border-color:#2a2a2a}
#path.edit{border-color:#4a4a4a;background:#090909}
#crumbs{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;white-space:nowrap;height:100%}
.cr{height:24px;display:flex;align-items:center;gap:6px;padding:0 7px;border-radius:6px;color:#bdbdbd;flex:none;max-width:260px}
.cr span{overflow:hidden;text-overflow:ellipsis}
.cr:hover{background:#1e1e1e;color:#fff}
.cr:last-child{color:var(--fg)}
.cr.drop{background:#2a2a2a;color:#fff}
.cr svg{width:15px;height:15px}
.chev{color:#4a4a4a;flex:none}
.chev svg{width:12px;height:12px}
.cr.more{color:var(--mut)}
#pathin{display:none;flex:1;min-width:0;background:none;border:0;outline:0;padding:0 7px;font-size:13px;caret-color:#fff}
#pathin::selection,#find::selection,.ren::selection,#palin::selection{background:#ededed;color:#000}
#path.edit #crumbs{display:none}
#path.edit #pathin{display:block}
#sugg{position:absolute;left:-1px;right:-1px;top:32px;background:#151515;border:1px solid #2c2c2c;border-radius:10px;padding:4px;display:none;z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#sugg.on{display:block}
.sg{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;color:#cfcfcf;white-space:nowrap;overflow:hidden}
.sg.on,.sg:hover{background:#262626;color:#fff}
.sg .fo{width:16px;height:13px}
#findw{width:230px;height:30px;background:var(--field);border:1px solid #1d1d1d;border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--mut);flex:none;transition:width .18s}
#findw:hover{border-color:#2a2a2a}
#findw.focus{border-color:#4a4a4a;background:#090909;width:300px;color:var(--dim)}
#findw svg{width:14px;height:14px}
#find{flex:1;min-width:0;background:none;border:0;outline:0;font-size:12.5px;caret-color:#fff;color:var(--fg)}
#find::placeholder{color:var(--mut)}
#findx{display:none;color:var(--dim);border-radius:5px}
#findx:hover{color:#fff;background:#262626}
#findw.has #findx{display:block}
#findx svg{width:13px;height:13px}

/* основная часть */
#main{flex:1;min-height:0;display:flex;padding:0 8px 0 0}
#card{flex:1;min-width:0;display:flex;background:var(--card);border:1px solid #1f1f1f;border-radius:12px;overflow:hidden}
#side{width:var(--sw);flex:none;background:var(--frame);overflow-y:auto;overflow-x:hidden;padding:4px 8px 16px 8px;position:relative}
#pill{position:absolute;left:8px;right:8px;top:0;height:30px;border-radius:8px;background:#232323;transition:transform .32s var(--ease),height .32s var(--ease),opacity .2s;pointer-events:none;opacity:0}
#pill::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:#ededed}
#side::-webkit-scrollbar{width:8px}
#side::-webkit-scrollbar-thumb{border-width:2px}
.sec{font-size:11px;color:var(--mut);padding:14px 10px 6px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between}
.sec:first-child{padding-top:6px}
.sec.drop{color:#fff}
.si{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;color:#b8b8b8;white-space:nowrap;position:relative;z-index:1;transition:background .15s,color .15s}
.si span{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.si:hover{background:#1c1c1c;color:#fff}
.si.on{color:#fff}
.si.on:hover{background:transparent}
.si.drop{background:#2a2a2a;color:#fff}
.si svg{color:#8a8a8a;transition:color .15s}
.si:hover svg,.si.on svg{color:#e0e0e0}
.si .fo{width:16px;height:13px}
.si.drv{height:44px;align-items:flex-start;padding-top:7px}
.dn{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dn span{overflow:hidden;text-overflow:ellipsis}
.dn i{display:block;height:3px;border-radius:2px;background:#232323;overflow:hidden}
.dn i u{display:block;height:100%;background:#9a9a9a;border-radius:2px}
.dn i u.full{background:#ededed}
.si small{font-size:10.5px;color:var(--mut);margin-left:auto;flex:none}
.split{width:8px;margin:0 -4px;cursor:col-resize;flex:none;z-index:5;position:relative}
.split:hover::after,.split.on::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:#3a3a3a}

#pane{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#head{height:34px;flex:none;display:grid;grid-template-columns:var(--cols);align-items:center;padding:0 var(--hr,10px) 0 8px;color:var(--mut);font-size:11.5px;border-bottom:1px solid #161616}
#head div{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;white-space:nowrap;overflow:hidden}
#head div:hover{color:#bdbdbd}
#head div.on{color:#cfcfcf}
#head div svg{width:10px;height:10px;stroke-width:1.8}
#head .r{justify-content:flex-end}
#head div:first-child{padding-left:32px}
#pane.grid #head{display:none}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;outline:0}
#sizer{width:1px}
#items{position:absolute;left:0;right:0;top:0}
#band{position:absolute;display:none;border:1px solid #8a8a8a;background:rgba(237,237,237,.07);border-radius:3px;pointer-events:none;z-index:4}
.row{position:absolute;left:8px;right:8px;top:0;height:32px;display:grid;grid-template-columns:var(--cols);align-items:center;border-radius:8px;color:#d6d6d6;padding-right:2px;transition:background-color .14s,opacity .2s,box-shadow .14s}
.row>span{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{position:absolute;left:9px;top:8px;width:16px;height:16px;padding:0;display:grid;place-items:center;color:#a8a8a8}
.row .nm{padding-left:32px;color:var(--fg);font-size:13px}
.row .dt,.row .ty,.row .lc{color:var(--dim)}
.row .sz{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.row:hover,.tile:hover{background:var(--hover)}
.row.sel,.tile.sel{background:var(--sel)}
body.act .row.sel,body.act .tile.sel{background:var(--sel2)}
.row.cur,.tile.cur{box-shadow:inset 0 0 0 1px #474747}
.row.hid,.tile.hid{opacity:.5}
.row.cut,.tile.cut{opacity:.4}
.row.drop,.tile.drop{background:#3a3a3a;box-shadow:inset 0 0 0 1px #8a8a8a}
.ic .fo{width:16px;height:13px}
.ic img{position:absolute;inset:0;width:16px;height:16px;opacity:0;filter:grayscale(1) contrast(1.05)}
.ic.ok img{opacity:1}
.ic.ok svg{visibility:hidden}
.fo .b{fill:#4d4d4d;stroke:none}
.fo .f{fill:#9c9c9c;stroke:none}
.tile{position:absolute;left:8px;top:0;height:120px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:8px 6px 0;gap:6px;transition:background-color .14s,opacity .2s,box-shadow .14s}
.th>.fo,.th>.bf{transition:transform .25s var(--ease)}
.tile:hover .th>.fo,.tile:hover .th>.bf{transform:translateY(-2px)}
.th{width:100%;height:72px;display:grid;place-items:center;position:relative;flex:none}
.th>.fo{width:64px;height:52px}
.th img.tn{position:absolute;max-width:100%;max-height:72px;border-radius:4px;opacity:0;transition:opacity .15s;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 1px 0 rgba(255,255,255,.04),0 4px 14px rgba(0,0,0,.45)}
.th img.ti{position:absolute;width:48px;height:48px;opacity:0;left:50%;top:50%;transform:translate(-50%,-50%);filter:grayscale(1) contrast(1.05)}
.th.ok img{opacity:1}
.th.ok>.bf{visibility:hidden}
.tile .nm{font-size:12px;line-height:15px;text-align:center;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;max-width:100%;padding:0 2px}
.bf{position:relative;width:46px;height:58px;display:block}
.bf .page{width:46px;height:58px;stroke:#4e4e4e;stroke-width:1.2;fill:#131313}
.bf .gl{position:absolute;left:14px;top:22px;width:18px;height:18px;color:#b5b5b5;stroke-width:1.4}
.bf .ext{position:absolute;left:4px;bottom:7px;font:700 8.5px/13px "Segoe UI",sans-serif;padding:0 4px;border-radius:3px;background:#d9d9d9;color:#000;letter-spacing:.03em}
.ren{width:100%;height:24px;background:#0a0a0a;border:1px solid #6a6a6a;border-radius:5px;outline:0;padding:0 6px;color:#fff;caret-color:#fff;font-size:12.5px}
.row .nm:has(.ren){overflow:visible;padding-left:24px}
.tile .nm:has(.ren){overflow:visible;display:block;width:100%}
.tile .ren{text-align:center;height:22px}
#empty{position:absolute;left:0;right:0;top:30px;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);pointer-events:none}
#empty.on{display:flex}
#empty svg{width:28px;height:28px;stroke-width:1.2;color:#3a3a3a}
#pane.grid #empty{top:0}
.spin{width:14px;height:14px;border:1.6px solid #3a3a3a;border-top-color:#f0f0f0;border-radius:50%;animation:r .75s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}

/* движение */
.in{animation:rin .34s var(--ease) both}
@keyframes rin{from{opacity:0;translate:var(--dx,14px) 0}to{opacity:1;translate:0 0}}
.tile.in{animation-name:tin}
@keyframes tin{from{opacity:0;translate:0 10px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.fadein{animation:fin .26s var(--ease) both}
@keyframes fin{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
.tab.new{animation:tabin .28s var(--ease) both}
@keyframes tabin{from{opacity:0;max-width:0;padding:0}to{opacity:1;max-width:200px}}
.cr:last-child{animation:fin .3s var(--ease) both}
.btn,.win,#plus,.x{transition:background .14s,color .14s,transform .1s}
.btn:active,#plus:active,.x:active{transform:scale(.9)}
.pck,.pcdrive{transition:background .15s,border-color .15s,transform .25s var(--ease)}
.pck:hover,.pcdrive:hover{transform:translateY(-2px)}
@keyframes pop{from{opacity:0;scale:.95}to{opacity:1;scale:1}}

/* этот компьютер */
#pcview{position:absolute;inset:0;overflow-y:auto;padding:22px 26px 40px;display:none}
#pane.pc #pcview{display:block}
#pane.pc #head,#pane.pc #scroll{visibility:hidden}
.pch{font-size:11px;color:var(--mut);margin:6px 2px 12px;letter-spacing:.02em}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-bottom:26px}
.pck{height:112px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#d6d6d6}
.pck:hover{background:#141414}
.pck .fo{width:56px;height:46px}
.pcd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcdrive{display:flex;gap:14px;align-items:center;padding:16px;border-radius:12px;background:#101010;border:1px solid #1a1a1a}
.pcdrive:hover{background:#151515;border-color:#262626}
.pcdrive>svg{width:30px;height:30px;stroke-width:1.1;color:#9a9a9a}
.pcdrive div{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.pcdrive b{font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcdrive i{height:4px;border-radius:2px;background:#232323;overflow:hidden;display:block}
.pcdrive i u{display:block;height:100%;background:#a0a0a0}
.pcdrive i u.full{background:#ededed}
.pcdrive small{color:var(--mut);font-size:11px}

/* предпросмотр */
#prev{width:var(--pw);flex:none;background:#0e0e0e;border-left:1px solid #1a1a1a;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
body.nopv #prev,body.nopv #sp2{display:none}
#pv{padding:18px 18px 24px;display:flex;flex-direction:column;gap:4px;min-height:100%}
.pvmedia{min-height:120px;max-height:52vh;display:grid;place-items:center;margin-bottom:14px;position:relative;border-radius:10px;overflow:hidden}
.pvmedia.box{background:#0a0a0a;border:1px solid #1a1a1a}
.pvmedia img.pvimg{max-width:100%;max-height:52vh;display:block;border-radius:8px}
.pvmedia video{width:100%;max-height:52vh;border-radius:8px;background:#000}
.pvmedia iframe{width:100%;height:52vh;border:0;border-radius:8px;background:#1a1a1a}
.pvmedia audio{width:100%;margin-top:12px;height:36px}
.pvbig{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px;position:relative}
.pvbig .fo{width:96px;height:78px}
.pvbig .bf{transform:scale(1.5);margin:14px 0}
.pvbig .th{height:120px}
.pvbig .th img.tn{max-height:120px}
.pvbig .th img.ti{width:64px;height:64px}
.pvn{font-size:14px;color:var(--fg);word-break:break-word;line-height:19px;user-select:text;-webkit-user-select:text}
.pvm{color:var(--dim);margin-bottom:14px}
.pvi{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px;padding-top:14px;border-top:1px solid #1c1c1c}
.pvi dt{color:var(--mut)}
.pvi dd{color:#cfcfcf;word-break:break-all;user-select:text;-webkit-user-select:text}
.pvtxt{font:11.5px/1.55 "Cascadia Mono",Consolas,monospace;color:#bdbdbd;white-space:pre-wrap;word-break:break-all;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:12px 14px;max-height:52vh;overflow:auto;margin-bottom:14px;user-select:text;-webkit-user-select:text;tab-size:4}
.pvstack{position:relative;width:96px;height:96px;margin:18px auto 10px}
.pvstack span{position:absolute;inset:0;border-radius:12px;border:1px solid #3a3a3a;background:#141414}
.pvstack span:nth-child(1){transform:rotate(-8deg) translate(-6px,2px)}
.pvstack span:nth-child(2){transform:rotate(5deg) translate(5px,0)}
.pvstack span:nth-child(3){display:grid;place-items:center;font-size:26px;font-weight:300;color:#ededed;background:#1a1a1a}
.pvhint{margin-top:auto;padding-top:24px;color:#3e3e3e;font-size:11px;text-align:center}

/* строка состояния */
#status{height:28px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;background:var(--frame);color:var(--mut);font-size:11.5px;white-space:nowrap}
#status .spin{width:11px;height:11px}
#st1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
#st1 b{font-weight:400;color:#a8a8a8}

/* меню, палитра, уведомления */
#ctx{position:fixed;z-index:50;min-width:230px;background:rgba(24,24,24,.92);backdrop-filter:blur(18px);border:1px solid #2c2c2c;border-radius:12px;padding:5px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.6);transform-origin:var(--ox,0) var(--oy,0)}
#ctx.on{animation:pop .16s var(--ease)}
#ctx.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(-3px)}}
.mi{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;color:#dcdcdc;white-space:nowrap;transition:background .1s}
.mi.on{background:#2a2a2a;color:#fff}
.mi.dis{color:#4a4a4a;pointer-events:none}
.mi kbd{margin-left:auto;padding-left:26px;font:11px "Segoe UI",sans-serif;color:var(--mut)}
.mi .ck{width:14px;display:grid;place-items:center}
.mi .ck svg{width:13px;height:13px;stroke-width:1.8}
.mi.b{font-weight:600}
.ms{height:1px;background:#262626;margin:5px 6px}
.mr{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 10px;color:var(--mut);font-size:11.5px;height:32px}
.mr span{flex:1}
.mr i{font-style:normal;height:24px;display:grid;place-items:center;padding:0 9px;border-radius:6px;color:#bdbdbd;background:#1f1f1f;font-size:11.5px}
.mr i:hover{background:#2a2a2a;color:#fff}
.mr i.on{background:#ededed;color:#000}
#veil{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.4)}
#veil.on{animation:vin .2s both}
@keyframes vin{from{opacity:0}}
#veil.on{display:block}
#pal{position:fixed;z-index:45;left:50%;top:76px;transform:translateX(-50%);width:min(600px,calc(100% - 40px));background:#151515;border:1px solid #2c2c2c;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.7);display:none;overflow:hidden;animation:in .14s}
#pal.on{display:block;animation:palin .2s var(--ease)}
@keyframes palin{from{opacity:0;translate:0 -8px;scale:.98}}
#palw{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #232323;color:var(--dim)}
#palin{flex:1;background:none;border:0;outline:0;font-size:15px;caret-color:#fff;color:var(--fg)}
#palin::placeholder{color:var(--mut)}
#pall{max-height:420px;overflow-y:auto;padding:6px}
.pi{height:38px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:8px;color:#d6d6d6;transition:background .1s}
.pi.on{background:#262626;color:#fff}
.pi .fo{width:16px;height:13px}
.pi>svg{color:#9a9a9a}
.pi .pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:60%}
.pi .ps{flex:1;min-width:0;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.pi kbd{font:11px "Segoe UI",sans-serif;color:var(--mut);flex:none}
.pi mark{background:none;color:#fff;font-weight:600}
.pg{font-size:11px;color:var(--mut);padding:10px 10px 4px}
#toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,10px);background:#ededed;color:#000;padding:8px 16px;border-radius:18px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#2a2a2a;color:#fff;border:1px solid #444}
#modal{position:fixed;z-index:55;left:50%;top:30%;transform:translateX(-50%);width:380px;background:#171717;border:1px solid #2c2c2c;border-radius:14px;padding:20px 20px 16px;display:none;box-shadow:0 24px 60px rgba(0,0,0,.7)}
#modal.on{display:block;animation:in .14s}
#modal h3{font-size:14px;font-weight:500;margin-bottom:6px}
#modal p{color:var(--dim);margin-bottom:18px}
#modal .bt{display:flex;justify-content:flex-end;gap:8px}
#modal button{border:0;font:inherit;height:30px;padding:0 16px;border-radius:8px;background:#262626;color:#fff;cursor:default}
#modal button:hover{background:#303030}
#modal button.ok{background:#ededed;color:#000}
#modal button.ok:hover{background:#fff}
#ghost{position:fixed;top:-100px;left:0;background:#ededed;color:#000;padding:4px 10px;border-radius:12px;font-size:12px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}

  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  // глобальные
  if (C && !Sh && code === 'KeyK' || C && Sh && code === 'KeyP') { stop(); return palette(); }
  if (C && !Sh && code === 'KeyT') { stop(); return newTab(); }
  if (C && !Sh && code === 'KeyW' || C && k === 'F4') { stop(); return closeTab(); }
  if (C && k === 'Tab') { stop(); return activate((act + (Sh ? -1 : 1) + tabs.length) % tabs.length); }
  if (C && !Sh && /^Digit[1-9]$/.test(code)) { stop(); const n = +code.slice(5); return activate(n === 9 ? tabs.length - 1 : n - 1); }
  if (C && !Sh && code === 'KeyL' || A && code === 'KeyD' || k === 'F4' && !C && !A) { stop(); return editPath(); }
  if (C && !Sh && (code === 'KeyF' || code === 'KeyE')) { stop(); return focusFind(); }
  if (k === 'F5' || C && code === 'KeyR') { stop(); return refresh(); }
  if (A && k === 'ArrowLeft') { stop(); return back(); }
  if (A && k === 'ArrowRight') { stop(); return fwd(); }
  if (A && k === 'ArrowUp') { stop(); return up(); }
  if (C && code === 'KeyH') { stop(); return toggleHidden(); }
  if (C && code === 'Backquote') { stop(); return term(); }
  if (C && Sh && code === 'KeyN') { stop(); return newItem('dir'); }
  if (C && Sh && code === 'Digit1') { stop(); return setView('list'); }
  if (C && Sh && code === 'Digit2') { stop(); return setView('grid'); }
  if (inInput || e.target.isContentEditable) return;
  if (isPC(t.path)) { if (k === 'Backspace') { stop(); back(); } return; }
  const g = geo(), pageRows = Math.max(1, Math.floor(scroller.clientHeight / g.rowH) - 1);
  switch (k) {
    case 'ArrowDown': stop(); return moveCur(g.cols, Sh, C);
    case 'ArrowUp': stop(); return moveCur(-g.cols, Sh, C);
    case 'ArrowRight': if (g.cols > 1) { stop(); return moveCur(1, Sh, C); } return;
    case 'ArrowLeft': if (g.cols > 1) { stop(); return moveCur(-1, Sh, C); } return;
    case 'PageDown': stop(); return moveCur(pageRows * g.cols, Sh, C);
    case 'PageUp': stop(); return moveCur(-pageRows * g.cols, Sh, C);
    case 'Home': stop(); return moveCur(-1e9, Sh, C);
    case 'End': stop(); return moveCur(1e9, Sh, C);
    case 'Enter': stop(); if (A) return props(); return openSel(C);
    case 'Backspace': stop(); return back();
    case 'Delete': stop(); return del(Sh);
    case 'F2': stop(); return startRename();
    case 'Escape': stop(); if (t.search) return exitSearch(t); if (t.filter) { $('#find').value = ''; t.filter = ''; findState(); recompute(t); return paint(); } t.sel.clear(); cutSet.clear(); render(); return paintSel();
    case 'ContextMenu': stop(); { const el = nodes.get(t.cur) || [...nodes.values()].find(x => x.classList.contains('sel')); if (el && t.sel.size) { const r = el.getBoundingClientRect(); itemMenu(r.left + 40, r.top + r.height / 2, Sh); } else bgMenu(innerWidth / 2, innerHeight / 3); } return;
  }
  if (Sh && k === 'F10') { stop(); const s = selEntries(t); if (s.length) { const el = nodes.get(t.cur); const r = el ? el.getBoundingClientRect() : {left: 200, top: 200, height: 0}; send('menu', {src: s.map(x => x.p), x: r.left + 40, y: r.top + r.height / 2}); } return; }
  if (C && !Sh) {
    if (code === 'KeyA') { stop(); t.sel = new Set(t.vis.map(x => key(x.p))); render(); return paintSel(); }
    if (code === 'KeyC') { stop(); return copySel(false); }
    if (code === 'KeyX') { stop(); return copySel(true); }
    if (code === 'KeyV') { stop(); return paste(); }
  }
  if (C && Sh && code === 'KeyC') { stop(); return copyPath(); }
  if (k === ' ' && !(Date.now() - taT < 800 && ta)) { stop(); return togglePreview(); }
  // набор имени — прыжок к файлу
  if (!C && !A && k.length === 1) {
    stop();
    const now = Date.now();
    ta = (now - taT < 800 ? ta : '') + k.toLowerCase(); taT = now;
    const n = t.vis.length, start = ta.length === 1 ? curIndex(t) + 1 : Math.max(0, curIndex(t));
    for (let j = 0; j < n; j++) {
      const i = (start + j) % n;
      if (t.vis[i].lc.startsWith(ta)) { selectOnly(t, key(t.vis[i].p)); reveal(); paintSel(); break; }
    }
  }
});

// ---------------------------------------------------------------- события от приложения
wv.addEventListener('message', ev => {
  const m = ev.data;
  if (m.r !== undefined) {
    const w = waits.get(m.r);
    if (w) { waits.delete(m.r); m.e !== undefined ? w.rej(m.e) : w.res(m.v); }
    return;
  }
  switch (m.ev) {
    case 'changed': {
      const set = new Set(m.dirs.map(key));
      for (const t of tabs) if (!t.search && set.has(key(t.path))) { if (t === tab()) load(t, true); else t.stale = true; }
      clearTimeout(drvT); drvT = setTimeout(refreshDrives, 1500);
      break;
    }
    case 'search': onSearch(m); break;
    case 'dirsize': onDirSize(m); break;
    case 'menu': if (m.verb === 'rename') startRename(); else reloadSoon(); break;
    case 'open': openPath(m.p, true); break;
    case 'focus': document.body.classList.toggle('act', m.on); if (m.on) { refreshDrives(); } break;
    case 'win': $('#wmax').innerHTML = svg(m.max ? UI.restore : UI.max); setTimeout(paintPath, 30); break;
  }
});
let drvT;

// ---------------------------------------------------------------- сохранение и запуск
let saveT;
function saveSoon() {
  clearTimeout(saveT);
  saveT = setTimeout(() => send('save', {state: {view: S.view, sort: S.sort, hidden: S.hidden, preview: S.preview, pins: S.pins, recent: S.recent.slice(0, 60), sideW: S.sideW, prevW: S.prevW, tabs: tabs.map(t => t.path), active: act}}), 400);
}
async function openPath(p, inNewTab) {
  if (!p) { if (inNewTab) newTab(); return; }
  let st = {ok: false};
  try { st = await call('stat', {p}); } catch (e) {}
  const target = st.ok && !st.dir ? dirOf(p) : p;
  if (inNewTab) { const t = newTab(target); if (st.ok && !st.dir) t.wantSel = p; }
  else go(tab(), target, st.ok && !st.dir ? {select: p} : {});
}
let booted = false, initDone = false;
function boot() {
  booted = true;
  requestAnimationFrame(() => requestAnimationFrame(() => send('ready')));
}
(async function init() {
  applyLayout();
  refreshDrives();
  const list = B.test ? [] : Array.isArray(S.tabs) && S.tabs.length ? S.tabs : [];
  for (const p of list) newTab(p, undefined, false);
  act = Math.max(0, Math.min(S.active || 0, tabs.length - 1));
  initDone = true;
  if (B.open) await openPath(B.open, true);
  else if (!tabs.length) newTab(homePath());
  else { paint(); const t = tab(); if (!t.loading && !booted) boot(); }
  scroller.focus();
})();
</script>
